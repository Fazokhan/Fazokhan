<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Open source: building in the open" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
      .mono{font-family:Menlo,Consolas,"Courier New",monospace}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0D10"/>
      <stop offset="1" stop-color="#16181F"/>
    </linearGradient>
    <clipPath id="l1"><rect x="72" y="84" width="0" height="22"><animate attributeName="width" values="0;380" dur="1.1s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="72" y="108" width="0" height="22"><animate attributeName="width" values="0;400" dur="1.1s" begin="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="72" y="132" width="0" height="22"><animate attributeName="width" values="0;250" dur="0.9s" begin="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="72" y="156" width="0" height="22"><animate attributeName="width" values="0;280" dur="0.9s" begin="3.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="960" height="260" fill="url(#bg)"/>

  <!-- Terminal window -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0s" fill="freeze"/>
    <rect x="48" y="36" width="520" height="190" rx="16" fill="#111318" stroke="#2C303A" stroke-width="1.5"/>
    <line x1="48" y1="72" x2="568" y2="72" stroke="#22252D" stroke-width="1"/>
    <circle cx="74" cy="54" r="5" fill="#5E6473"/>
    <circle cx="92" cy="54" r="5" fill="#5E6473"/>
    <circle cx="110" cy="54" r="5" fill="#F5B841"/>
    <text x="134" y="58" font-size="13" fill="#5E6473" class="mono">open-source ~ main</text>

    <text x="72" y="100" font-size="15" class="mono" fill="#F5B841">$</text>
    <g clip-path="url(#l1)">
      <text x="88" y="100" font-size="15" class="mono" fill="#F2EFE8">git pull --rebase origin main</text>
    </g>
    <g clip-path="url(#l2)">
      <text x="72" y="124" font-size="15" class="mono" fill="#F2EFE8">$ git commit -m 'Improve docs and tests'</text>
    </g>
    <g clip-path="url(#l3)">
      <text x="72" y="148" font-size="15" class="mono" fill="#F2EFE8">$ git push origin main</text>
    </g>
    <g clip-path="url(#l4)">
      <text x="72" y="172" font-size="15" class="mono" fill="#9AA0AE">✓ Pull request merged. Thanks, contributors.</text>
    </g>
    <rect x="72" y="190" width="9" height="16" fill="#F5B841">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Orbit emblem -->
  <g>
    <circle cx="740" cy="120" r="90" fill="none" stroke="#2C303A" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="740" cy="120" r="58" fill="none" stroke="#22252D" stroke-width="1.5"/>

    <circle cx="740" cy="120" r="34" fill="none" stroke="#F5B841" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="34;64" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="740" cy="120" r="34" fill="#15171C" stroke="#F5B841" stroke-width="2"/>
    <text x="740" y="128" font-size="22" font-weight="700" text-anchor="middle" fill="#F2EFE8" class="mono">&lt;/&gt;</text>

    <circle r="6" fill="#F5B841">
      <animateMotion dur="8s" repeatCount="indefinite" path="M740,30 a90,90 0 1,1 0,180 a90,90 0 1,1 0,-180"/>
    </circle>
    <circle r="5" fill="#9AA0AE">
      <animateMotion dur="6s" repeatCount="indefinite" path="M740,62 a58,58 0 1,0 0,116 a58,58 0 1,0 0,-116"/>
    </circle>
    <circle r="4" fill="#F2EFE8">
      <animateMotion dur="12s" begin="-4s" repeatCount="indefinite" path="M740,30 a90,90 0 1,1 0,180 a90,90 0 1,1 0,-180"/>
    </circle>

    <text x="740" y="240" font-size="14" text-anchor="middle" fill="#5E6473">Built in the open</text>
  </g>
</svg>
